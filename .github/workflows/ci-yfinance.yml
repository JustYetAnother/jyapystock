name: CI — yfinance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: yfinance tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # 3.14 is non-blocking: curl_cffi/cffi segfault on this interpreter today (upstream issue, not ours)
    continue-on-error: ${{ matrix.python-version == 3.14 }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.11, 3.12, 3.13, 3.14]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Poetry
        run: python -m pip install --upgrade pip "poetry==2.4.1"

      - name: Install dependencies
        run: poetry install --extras dev

      - name: Run yfinance-only tests
        env:
          PROVIDER: yfinance
        run: |
          env -u ALPHAVANTAGE_API_KEY poetry run python -m unittest discover -s tests -p 'test_*.py' -v
